name: Build and release Windows packages

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version (for example, 2.0.0-beta.1)"
        required: true
        default: "0.0.0-dev"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate package version
        env:
          PREVIEW_VERSION: ${{ inputs.version || '0.0.0-dev' }}
        shell: pwsh
        run: |
          @'
          import os
          from tools.build_windows import parse_version
          requested = (
              os.environ["GITHUB_REF_NAME"]
              if os.environ["GITHUB_REF_TYPE"] == "tag"
              else os.environ["PREVIEW_VERSION"]
          )
          version, _ = parse_version(requested)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BUILD_VERSION={version}\n")
          '@ | python -

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-6.7.4.exe"
          $compilerDirectory = Join-Path $env:RUNNER_TEMP "gr8-inno-setup"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $installerPath
          $expectedHash = "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
          if ((Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Inno Setup download failed its SHA-256 check."
          }
          $installerArguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PORTABLE=1", "/DIR=`"$compilerDirectory`"")
          $process = Start-Process -FilePath $installerPath -ArgumentList $installerArguments -WindowStyle Hidden -PassThru
          # Keep the process handle so its exit code remains available after it exits.
          $process.Handle | Out-Null
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compilerPath = Join-Path $compilerDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compilerPath)) {
            throw "Inno Setup compiler was not installed."
          }
          "ISCC_PATH=$compilerPath" >> $env:GITHUB_ENV

      - name: Build portable ZIP and installer
        run: python tools/build_windows.py --version "$env:BUILD_VERSION"

      - name: Upload build downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          assets=( *.zip *-setup.exe SHA256SUMS.txt )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            options=( --verify-tag --generate-notes --title "Gr8 Launcher ${RELEASE_TAG#v}" )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=( --prerelease )
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
          fi
